<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Grunge Jam Generator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>AI Grunge Jam Generator</h1>

        <div class="amp-cabinet">
            <div class="amp-panel">
                <span class="brand-logo">MUD-AMP 90</span>
                <div class="knobs">
                    <div class="knob-control">
                        <div class="knob-container">
                            <div class="amp-knob" id="knob-gain"></div>
                            <input type="range" id="gain-slider" min="1" max="30" step="0.5" value="18">
                        </div>
                        <label>GAIN</label>
                    </div>
                    <div class="knob-control">
                        <div class="knob-container">
                            <div class="amp-knob" id="knob-reverb"></div>
                            <input type="range" id="reverb-slider" min="0" max="1" step="0.05" value="0.3">
                        </div>
                        <label>REVERB</label>
                    </div>
                    <div class="knob-control">
                        <div class="knob-container">
                            <div class="amp-knob" id="knob-tone"></div>
                            <input type="range" id="tone-slider" min="500" max="8000" step="100" value="3000">
                        </div>
                        <label>TONE</label>
                    </div>
                </div>
            </div>

            <div class="oscilloscope-screen">
                <canvas id="oscilloscope"></canvas>
            </div>
        </div>

        <p>Оберіть ноти для AI-соло та гранж-ритму:</p>

        <div class="piano">
            <button class="key" data-note="C3">C3</button>
            <button class="key" data-note="D3">D3</button>
            <button class="key" data-note="E3">E3</button>
            <button class="key" data-note="F3">F3</button>
            <button class="key" data-note="G3">G3</button>
            <button class="key" data-note="A3">A3</button>
            <button class="key" data-note="B3">B3</button>
        </div>

        <div class="controls-panel">
            <button id="jam-btn">🎸 ЗАПУСТИТИ ДЖЕМ</button>
            <button id="stop-btn">STOP / RESET</button>
        </div>

        <div id="status">ГОТОВИЙ ДО РОБОТИ</div>

        <audio id="audio-player" style="display: none;"></audio>
    </div>

    <script src="app.js"></script>
</body>
</html>
